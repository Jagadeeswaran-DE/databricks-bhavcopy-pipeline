bundle:
  name: bhavcopy-pipeline

include:
    - resources/*.yml

variables:
  google_chat_enabled:
    description: Enable non-blocking Google Chat notifications.
    default: "false"
  google_chat_webhook_secret_scope:
    description: Databricks secret scope containing the Chat webhook.
    default: ""
  google_chat_webhook_secret_key:
    description: Databricks secret key containing the Chat webhook.
    default: ""
  date_range_start:
    description: Inclusive BhavCopy date range start.
    default: "2019-01-01"
  date_range_end:
    description: Inclusive BhavCopy date range end.
    default: "2020-12-31"

# Keep large local data artifacts out of the workspace deployment. Raw ZIPs are
# uploaded explicitly to the Unity Catalog volume by scripts/upload_raw_to_databricks.ps1.
sync:
  exclude:
    - .venv/**
    - .ua/**
    - __pycache__/**
    - downloads/**
    - extracted/**
    - organized/**
    - logs/**
    - screenshots/**
    - schemas/**
    - "*.csv"
    - schema_validation_report.json
    - state.json

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: jagadeeswaran
